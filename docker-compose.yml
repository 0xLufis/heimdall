services:
  # 1. Relational Database (PostgreSQL 17 with SSL & Multi-Tenant Init)
  postgres:
    image: postgres:17.9
    container_name: heimdall_postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_DB: heimdall_dev_db
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      TZ: Europe/Budapest
      PGTZ: Europe/Budapest
    secrets:
      - pg_user
      - pg_pw
    volumes:
      - ./infra/database/data:/var/lib/postgresql/data
      - ./infra/database/logs:/var/log/postgresql
      - ./infra/database/certs:/var/lib/postgresql/certs:ro
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c max_connections=300
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 4s
      timeout: 3s
      retries: 5
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 2. In-Memory Cache & Telemetry Spool Buffer
  redis:
    image: redis:7.4-alpine
    container_name: heimdall_redis
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass heimdall_redis_dev_secret --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./infra/database/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "heimdall_redis_dev_secret", "ping"]
      interval: 4s
      timeout: 3s
      retries: 5
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 3. Database Administration Portal
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: heimdall_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./infra/database/pgadmin:/var/lib/pgadmin
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 4. Backend REST API & gRPC Telemetry Collector (.NET 9 Hot-Reload)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: heimdall_backend
    hostname: backend
    ports:
      - "5099:5099"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5099;http://+:5001
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=heimdall_dev_db;Username=ef_admin;Password=migrate
      - REDIS_CONNECTION_STRING=redis:6379,password=heimdall_redis_dev_secret
    volumes:
      - ./shared:/workspace/shared
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 5. Nuxt 4 Web Frontend & Nitro BFF (Vite HMR)
  frontend:
    build:
      context: ./frontend/heimdall-web-frontend
      dockerfile: Dockerfile.dev
    container_name: heimdall_frontend
    hostname: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://dotnet_backend:your_backend_pw@postgres:5432/heimdall_dev_db
      - BACKEND_API_URL=http://backend:5099
    volumes:
      - ./frontend/heimdall-web-frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
      - postgres
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 6. Industrial Edge Agent Daemon (.NET 9 Hot-Reload)
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.dev
    container_name: heimdall_agent
    environment:
      - DOTNET_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - Backend__Url=http://backend:5001
    volumes:
      - ./shared:/workspace/shared
      - ./agent:/workspace/agent
    depends_on:
      - backend
    networks:
      - heimdall_dev_net
    restart: unless-stopped

  # 7. Industrial Edge Fleet Simulator
  simulator:
    build:
      context: ./simulators/edge-fleet-simulator
    container_name: heimdall_simulator
    command: ["--client", "ROBOT-CELL-01", "--count", "100"]
    environment:
      - GRPC_HOST=backend:5001
    depends_on:
      - backend
    networks:
      - heimdall_dev_net
    restart: unless-stopped

networks:
  heimdall_dev_net:
    driver: bridge

secrets:
  pg_user:
    file: ./infra/database/secrets/pg_user.txt
  pg_pw:
    file: ./infra/database/secrets/pg_pw.txt
