services:
  # 1. Production Relational Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    container_name: heimdall_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heimdall_db}
      POSTGRES_USER: ${POSTGRES_USER:-heimdall_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heimdall_secure_password_change_me}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - heimdall_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heimdall_admin} -d ${POSTGRES_DB:-heimdall_db} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - heimdall_prod_net

  # 2. In-Memory Cache & Spool Buffer (Redis)
  redis:
    image: redis:7-alpine
    container_name: heimdall_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-heimdall_redis_secure_password_change_me}"]
    volumes:
      - heimdall_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-heimdall_redis_secure_password_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - heimdall_prod_net

  # 3. Heimdall Backend Core REST & Telemetry API (.NET 10)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: heimdall_prod_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HTTP_PORT:-5001}:5001"
      - "${MQTT_PORT:-1883}:1883"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-heimdall_db};Username=${POSTGRES_USER:-heimdall_admin};Password=${POSTGRES_PASSWORD:-heimdall_secure_password_change_me}
      - REDIS_CONNECTION_STRING=redis:6379,password=${REDIS_PASSWORD:-heimdall_redis_secure_password_change_me}
      - MQTT_EMBEDDED_BROKER=true
      - MQTT_EMBEDDED_PORT=1883
      - HEIMDALL_AGENT_KEY=${HEIMDALL_AGENT_KEY:-heimdall_prod_agent_secret_key_change_me}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-heimdall_prod_jwt_secret_must_be_long_and_secure_64_bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heimdall_prod_net

  # 4. Nuxt 4 Web Frontend & Nitro BFF
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: heimdall_prod_frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - BACKEND_API_URL=http://backend:5001
      - SIGNALR_HUB_URL=http://backend:5001/hubs/maintenance
      - REDIS_URL=redis://:${REDIS_PASSWORD:-heimdall_redis_secure_password_change_me}@redis:6379
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-heimdall_prod_auth_secret_minimum_32_characters_long}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-heimdall_admin}:${POSTGRES_PASSWORD:-heimdall_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-heimdall_db}
    depends_on:
      - backend
      - postgres
      - redis
    networks:
      - heimdall_prod_net

  # 5. Optional Co-Located Edge Agent (Profile: agent)
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: heimdall_prod_agent
    restart: unless-stopped
    profiles:
      - agent
    environment:
      - DOTNET_ENVIRONMENT=Production
      - MQTT_BROKER_HOST=backend
      - MQTT_BROKER_PORT=1883
      - HEIMDALL_AGENT_KEY=${HEIMDALL_AGENT_KEY:-heimdall_prod_agent_secret_key_change_me}
    depends_on:
      - backend
    networks:
      - heimdall_prod_net

volumes:
  heimdall_prod_pgdata:
  heimdall_prod_redisdata:

networks:
  heimdall_prod_net:
    driver: bridge
