services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_heimdall
    profiles:
      - debug
      - pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      # pgAdmin refuses reserved/special-use domains such as .local when it initialises.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@heimdall.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      # Named volume: pgAdmin runs as uid 5050 and cannot write to a host bind mount owned by root/you.
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    networks:
      - heimdall_net
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: postgres_heimdall
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_DB: heimdall_dev_db
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      TZ: Europe/Budapest
      PGTZ: Europe/Budapest
    secrets:
      - pg_user
      - pg_pw
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
      - ./certs:/certs:ro
      - ./pg-entrypoint.sh:/usr/local/bin/pg-entrypoint.sh:ro
      - ./init:/docker-entrypoint-initdb.d
    # Installs the bind-mounted TLS key with the ownership PostgreSQL requires, then runs the stock entrypoint.
    entrypoint: ["bash", "/usr/local/bin/pg-entrypoint.sh"]
    command: >
      postgres 
      -c ssl=on
      -c ssl_cert_file=/etc/postgresql-tls/server.crt
      -c ssl_key_file=/etc/postgresql-tls/server.key
      -c max_connections=300
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql.log
      -c log_statement=ddl
      -c log_connections=on
      -c log_disconnections=on
      -c log_destination=stderr,csvlog
      -c log_rotation_age=1d
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    networks:
      - heimdall_net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: redis_heimdall
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - heimdall_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=heimdall_redis_dev_secret redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  heimdall_net:
    driver: bridge

volumes:
  pgadmin_data:

secrets:
  pg_user:
    file: ./secrets/pg_user.txt
  pg_pw:
    file: ./secrets/pg_pw.txt
