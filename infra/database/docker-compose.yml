services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_heimdall
    user: root
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    networks:
      - heimdall_net
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: postgres_heimdall
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_DB: heimdall_dev_db
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      TZ: Europe/Budapest
      PGTZ: Europe/Budapest
    secrets:
      - pg_user
      - pg_pw
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
      - ./certs:/var/lib/postgresql/certs:ro
      - ./init:/docker-entrypoint-initdb.d
    command: >
      postgres 
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/certs/server.key
      -c max_connections=300
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql.log
      -c log_statement=ddl
      -c log_connections=on
      -c log_disconnections=on
      -c log_destination=stderr,csvlog
      -c log_rotation_age=1d
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    networks:
      - heimdall_net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: redis_heimdall
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-heimdall_redis_dev_secret} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis_data:/data
    networks:
      - heimdall_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "heimdall_redis_dev_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  heimdall_net:
    driver: bridge

secrets:
  pg_user:
    file: ./secrets/pg_user.txt
  pg_pw:
    file: ./secrets/pg_pw.txt
